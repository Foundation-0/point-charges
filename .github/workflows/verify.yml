name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Interval arithmetic vs exact rationals
        run: python tests/test_ia.py
      - name: Independent verifier on committed certificates
        run: python verify_arb.py certificates/*.json
      - name: Negative controls (corrupted certificates must be rejected)
        run: python tests/test_verifier_rejects.py
      - name: Certifier runs and its output verifies
        run: |
          python make_certs.py
          python verify_arb.py certificates/*.json
